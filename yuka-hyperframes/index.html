<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP embarqué en local : rendu sans dépendance réseau -->
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; src: url("assets/Poppins-800.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Inter"; src: url("assets/Inter.woff2") format("woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #3fb56a; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; }
      .clip { position: absolute; inset: 0; }

      /* révélation : disque blanc qui envahit le fond vert */
      #reveal { position: absolute; left: 540px; top: 960px; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; border-radius: 50%; background: #fff; }

      .center { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #logo { display: flex; align-items: center; gap: 38px; }
      #logo .tile { width: 170px; height: 170px; border-radius: 48px; background: #3fb56a; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 40px rgba(30,120,60,.35); }
      #logo .word { font-family: Poppins, sans-serif; font-weight: 800; font-size: 146px; color: #1c2421; letter-spacing: -2px; }

      #tagline { display: flex; flex-wrap: wrap; justify-content: center; max-width: 1000px; gap: 6px 18px; margin-top: 40px; }
      #tagline span { white-space: nowrap; font-family: Poppins, sans-serif; font-weight: 800; font-size: 62px; color: #1c2421; letter-spacing: -1px; display: inline-block; }
      #tagline span.accent { color: #2a9a55; }

      #cta { margin-top: 50px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
      #cta .pill { background: #1f7f45; color: #fff; font-weight: 800; font-size: 36px; border-radius: 999px; padding: 22px 54px; box-shadow: 0 16px 40px rgba(30,120,60,.35); }
      #cta .stores { display: flex; gap: 16px; }
      #cta .stores div { background: #1c2421; color: #fff; font-weight: 700; font-size: 26px; border-radius: 14px; padding: 14px 28px; }

      .product { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .badge { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 999px; padding: 6px 14px; box-shadow: 0 8px 20px rgba(0,0,0,.12); font-weight: 700; font-size: 22px; color: #1c2421; white-space: nowrap; }
      .dot { width: 14px; height: 14px; border-radius: 14px; display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <!-- musique : fin de la bande-son de la pub Remotion -->
      <audio id="music" src="assets/outro.wav" data-start="0" data-duration="5" data-volume="1"></audio>

      <div id="scene" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="reveal"></div>

        <!-- produits qui flottent aux quatre coins -->
        <div class="product" id="p1" style="left:110px; top:190px">
          <svg width="170" height="216" viewBox="0 0 220 280">
            <path d="M30 20 L190 20 L210 40 L210 270 L50 270 L30 250 Z" fill="#a98a5c"/>
            <rect x="30" y="20" width="160" height="250" rx="6" fill="#f1e2c4"/>
            <rect x="30" y="20" width="160" height="74" rx="6" fill="#3f7d4a"/>
            <text x="110" y="62" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="25" fill="#fff">AVÉNA</text>
            <ellipse cx="75" cy="160" rx="32" ry="30" fill="#d9b77a"/><ellipse cx="140" cy="175" rx="32" ry="30" fill="#d9b77a"/>
            <circle cx="165" cy="238" r="20" fill="#3f7d4a"/>
            <text x="165" y="243" text-anchor="middle" font-family="Inter" font-weight="800" font-size="13" fill="#fff">BIO</text>
          </svg>
          <span class="badge"><i class="dot" style="background:#1f9d4c"></i>82/100 · Excellent</span>
        </div>
        <div class="product" id="p2" style="left:800px; top:230px">
          <svg width="80" height="200" viewBox="0 0 120 300">
            <rect x="18" y="10" width="84" height="60" rx="14" fill="#b8d9a8"/>
            <rect x="14" y="62" width="92" height="228" rx="18" fill="#f3f7ef"/>
            <rect x="14" y="120" width="92" height="70" fill="#2f6e3b"/>
            <text x="60" y="160" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="17" fill="#fff">NATURA</text>
          </svg>
          <span class="badge"><i class="dot" style="background:#1f9d4c"></i>88/100 · Excellent</span>
        </div>
        <div class="product" id="p3" style="left:110px; top:1480px">
          <svg width="150" height="162" viewBox="0 0 130 140">
            <path d="M10 20 L120 20 L108 130 L22 130 Z" fill="#fff" stroke="#e6ece9" stroke-width="2"/>
            <rect x="6" y="10" width="118" height="16" rx="6" fill="#5ab4e8"/>
            <path d="M18 60 L112 60 L106 100 L24 100 Z" fill="#ffc9d6"/>
            <text x="65" y="86" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="16" fill="#a63354">FRAISE</text>
          </svg>
          <span class="badge"><i class="dot" style="background:#7cc243"></i>64/100 · Bon</span>
        </div>
        <div class="product" id="p4" style="left:790px; top:1440px">
          <svg width="150" height="229" viewBox="0 0 170 260">
            <rect x="10" y="10" width="150" height="240" rx="6" fill="#f5c542"/>
            <rect x="10" y="10" width="150" height="60" rx="6" fill="#e5432f"/>
            <text x="85" y="50" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="24" fill="#fff">CRUNCHY</text>
            <ellipse cx="85" cy="170" rx="52" ry="34" fill="#fff"/>
          </svg>
          <span class="badge"><i class="dot" style="background:#f08c1a"></i>41/100 · Médiocre</span>
        </div>

        <div class="center">
          <div id="logo">
            <div class="tile">
              <svg width="119" height="119" viewBox="0 0 64 64">
                <path d="M30 22 C40 20 46 26 44 34 L26 58 C24 61 20 59 21 56 L28 30 C28 26 28 23 30 22 Z" fill="#f58a2c"/>
                <path d="M30 34 l6 2 M28 42 l5 2 M26 50 l4 1" stroke="#d96d14" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M36 22 C34 12 38 6 42 4 C42 12 40 17 38 22 Z" fill="#fff"/>
                <path d="M38 23 C44 14 52 13 56 14 C52 20 46 23 40 25 Z" fill="#fff"/>
              </svg>
            </div>
            <span class="word">yuka</span>
          </div>
          <div id="tagline">
            <span>Scannez.</span><span>Comprenez.</span><span class="accent">Choisissez mieux.</span>
          </div>
          <div id="cta">
            <div class="pill">Téléchargez Yuka gratuitement</div>
            <div class="stores"><div>App Store</div><div>Google Play</div></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 0,0 s — le blanc envahit le vert
      tl.fromTo("#reveal", { scale: 0 }, { scale: 1, duration: 0.6, ease: "power3.inOut" }, 0);
      // 0,33 s — le logo rebondit
      tl.fromTo("#logo", { scale: 0 }, { scale: 1, duration: 0.7, ease: "back.out(2)" }, 0.33);
      // 0,6 s — produits aux quatre coins
      tl.fromTo(".product", { scale: 0, rotation: -12 }, { scale: 0.9, rotation: 0, duration: 0.6, ease: "back.out(1.8)", stagger: 0.13 }, 0.6);
      // 0,73 s — accroche mot par mot
      tl.fromTo("#tagline span", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "expo.out", stagger: 0.2 }, 0.73);
      // 1,47 s — appel à l'action
      tl.fromTo("#cta", { scale: 0 }, { scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 1.47);
      // flottement des produits (nombre de répétitions fixe = déterministe)
      ["#p1", "#p2", "#p3", "#p4"].forEach((id, i) => {
        tl.to(id, { y: -14, rotation: i % 2 ? 4 : -4, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 4 }, 1.2 + i * 0.15);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
